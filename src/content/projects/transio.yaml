name: Transio
url: https://transio.arjunsubedi.com
order: 1
summary: "Live public transport for Northern Ireland: vehicle tracking, timetables, disruptions, journey planning and arrival estimates. When a bus stops reporting, a route profile learned from GPS history predicts where it is, cutting 10-minute position error by 44%, and a LightGBM regression correction is retrained weekly and scored in shadow. A Spring Boot backend feeds a Flutter app, running on Kubernetes."
tags: [Java 21, Spring Boot, LightGBM, Python, MySQL, Redis, Flutter, Kubernetes, Grafana]

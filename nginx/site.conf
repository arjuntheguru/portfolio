# The portfolio site. Static files from Astro's dist/.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Behind the ingress and Cloudflare: keep redirects relative so they stay on https.
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Pages keep their URLs across deploys, so browsers must check back before reusing one.
    # A location that sets its own headers drops the server-level ones, so they are repeated here.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri $uri.html $uri/index.html =404;
    }

    # Astro puts a content hash in every file name here, so these never change.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }

    location = /portrait.svg {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    error_page 404 /404.html;
    error_page 500 502 503 504 /503.html;
    location = /404.html { internal; }
    location = /503.html { internal; add_header Cache-Control "no-store" always; }
}
